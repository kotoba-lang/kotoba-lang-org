name: build
# Rebuild kotoba-lang.org from the pinned language authority and require the
# committed site/dist to be reproduced byte for byte (root ADR-2610100100).
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch the language authority (authority.lock)
        run: sh scripts/fetch-authority.sh
      - run: npm ci
      - run: npm run site:build
      - name: site/dist is reproduced exactly
        run: git diff --exit-code --stat -- site/dist
